name: Stop QEMU cFS Virtual Machine
description: 'Stops a QEMU virtual machine'

inputs:
  container-id:
    description: "Docker container ID"
    required: true

runs:
  using: 'composite'
  steps:
    - name: Stop container
      if: inputs.container-id != ''
      shell: bash
      env:
        INPUT_CONTAINER_ID: ${{ inputs.container-id }}
      run: docker stop "${INPUT_CONTAINER_ID}"

    - name: Remove container
      if: inputs.container-id != ''
      shell: bash
      env:
        INPUT_CONTAINER_ID: ${{ inputs.container-id }}
      run: docker rm "${INPUT_CONTAINER_ID}"

    - name: List Containers
      shell: bash
      run: docker ps -a